name: Selenium Java Tests & Docker Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java version
        run: java -version

      - name: Verify Chrome version
        run: chrome --version

      - name: Execute mvn clean test
        run: mvn clean test

  build-and-publish-docker:
    name: Build, Verify and Publish Docker Image
    needs: selenium-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ramreddy80/selenium-testng-automation6:local-test

      - name: Execute Docker container and verify tests
        run: |
          docker run --rm --shm-size=2g ramreddy80/selenium-testng-automation6:local-test

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ramreddy80/selenium-testng-automation6:latest
            ramreddy80/selenium-testng-automation6:${{ github.sha }}
